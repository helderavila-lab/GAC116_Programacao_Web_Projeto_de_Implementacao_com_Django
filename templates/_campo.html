{# Renderiza um campo de formulário no padrão do Bootstrap (rótulo, campo, ajuda e erros). #}
<div class="mb-3">
  <label for="{{ campo.id_for_label }}" class="form-label">
    {{ campo.label }}{% if campo.field.required %} <span class="text-danger">*</span>{% endif %}
  </label>
  {{ campo }}
  {% if campo.errors %}
    <div class="invalid-feedback d-block">{{ campo.errors|join:" " }}</div>
  {% elif campo.help_text %}
    <div class="form-text">{{ campo.help_text|safe }}</div>
  {% endif %}
</div>
